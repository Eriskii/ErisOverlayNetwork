name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # eon's ErisDB tests run ErisDB's real core, built from its own repository, on a real
      # Postgres in the Docker the runner already has.
      - uses: actions/checkout@v4
        with:
          repository: Eriskii/ErisDB
          path: erisdb-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
        env:
          ERISDB_SOURCE: ${{ github.workspace }}/erisdb-source/erisdb
      - name: The page's types and unit tests
        working-directory: eon/web
        run: |
          npm ci
          npm run check
          npm test

  # What differs on macOS: its sockets, its runtime directory, and what it will dial. The runner has
  # no Docker, so eon's ErisDB tests run on Linux alone.
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo test --locked -p erisoverlaynetwork
      - run: cargo test --locked -p eon --test adding --test apps --test mesh --test mobile --test page

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865"
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo install cargo-ndk --locked
      - name: Build the APK with its JNI library, running the app's unit tests
        run: ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865" scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: eon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
