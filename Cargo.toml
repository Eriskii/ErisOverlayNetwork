[workspace]
members = [".", "eon", "eon-android"]
resolver = "3"

[package]
name = "erisoverlaynetwork"
version = "0.3.0"
edition = "2024"
description = "The Eris mesh: one signed list of your devices, approvals for the apps on them, and the connections between them, over Iroh"
license = "MIT"
repository = "https://github.com/Eriskii/ErisOverlayNetwork"
readme = "README.md"
keywords = ["iroh", "mesh", "pairing", "capability", "auth"]
categories = ["authentication", "network-programming"]

[features]
default = ["native"]
# What runs on a device or a serving app, as opposed to in a browser: the mesh
# node, local-network discovery, the agent socket, QR codes and the terminal prompt.
native = [
    "iroh/default",
    "dep:iroh-mdns-address-lookup",
    "dep:qrcode",
    "dep:png",
    "tokio/net",
    "tokio/rt",
    "tokio/macros",
    "tokio/time",
    "tokio/signal",
    "tokio/io-util",
]

[dependencies]
base64 = "0.22"
hmac = "0.12"
iroh = { version = "1", default-features = false }
iroh-mdns-address-lookup = { version = "0.6", optional = true }
libc = "0.2"
n0-future = "0.3"
png = { version = "0.18.1", optional = true }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"], optional = true }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# A relay on loopback, for the tests of what a relay-only network finds.
iroh-relay = { version = "1", features = ["server"] }
rqrr = "0.10.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# In a browser, randomness comes from the Web Crypto API.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }

[profile.release]
# The Android library ships in the APK; its dynamic symbols, the JNI entry points, stay.
strip = "symbols"
