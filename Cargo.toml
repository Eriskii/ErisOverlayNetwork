[package]
name = "erisauth"
version = "0.1.0"
edition = "2024"
description = "Sign apps in to Eris services from a device you already trust, with one approval"
license = "MIT"
repository = "https://github.com/Eriskii/ErisAuth"
readme = "README.md"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
erislogin = { git = "https://github.com/Eriskii/ErisLogin", tag = "v0.3.1" }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8"
erisdb = { git = "https://github.com/Eriskii/ErisDB", rev = "f69ca4f92e8164dd4d0b879f6aae73c5a41214a1" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
