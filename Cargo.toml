[workspace]
members = [".", "erisauth-android"]
resolver = "3"

[package]
name = "erisauth"
version = "0.2.0"
edition = "2024"
description = "The core of each device in an Eris mesh: its key, its devices, and the apps it approves"
license = "MIT"
repository = "https://github.com/Eriskii/ErisAuth"
readme = "README.md"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
erisoverlaynetwork = { git = "https://github.com/Eriskii/ErisOverlayNetwork", tag = "v0.2.0" }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh = "1"
rand = "0.9"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
# Its tests keep one Postgres and use it again on the next run.
testcontainers = { version = "0.27", features = ["reusable-containers"] }

[profile.release]
# The Android library ships in the APK; its dynamic symbols, the JNI entry points, stay.
strip = "symbols"
