[workspace]
members = [".", "erisauth-android"]
resolver = "3"

[package]
name = "erisauth"
version = "0.1.0"
edition = "2024"
description = "Sign apps in to Eris services from a device you already trust, with one approval"
license = "MIT"
repository = "https://github.com/Eriskii/ErisAuth"
readme = "README.md"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
erisdb-client = { git = "https://github.com/Eriskii/ErisDB", rev = "f19a3aa3f371675036b36e01aaff8007a74df630" }
erislogin = { git = "https://github.com/Eriskii/ErisLogin", tag = "v0.4.1" }
iroh = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[dev-dependencies]
erisfiles = { git = "https://github.com/Eriskii/ErisFiles", rev = "a55afd1829c51a393880d6864cde5e491c37912f" }
erisdb = { git = "https://github.com/Eriskii/ErisDB", rev = "f19a3aa3f371675036b36e01aaff8007a74df630" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[profile.release]
# The Android library ships in the APK; its dynamic symbols, the JNI entry points, stay.
strip = "symbols"
