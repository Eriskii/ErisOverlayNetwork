[package]
name = "erisauth"
version = "0.2.0"
edition = "2024"
description = "Pairing devices and apps over Iroh: scannable tickets, fingerprint ceremonies, signed tokens, permissions, keys"
license = "MIT"
repository = "https://github.com/Eriskii/ErisAuth"
readme = "README.md"
keywords = ["iroh", "pairing", "qr", "capability", "auth"]
categories = ["authentication", "network-programming"]

[dependencies]
base64 = "0.22"
hmac = "0.12"
iroh = "1"
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rqrr = "0.10.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
