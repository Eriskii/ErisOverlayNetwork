[package]
name = "erislogin"
version = "0.4.1"
edition = "2024"
description = "Pairing devices and apps over Iroh: scannable tickets, fingerprint ceremonies, signed tokens, permissions, keys"
license = "MIT"
repository = "https://github.com/Eriskii/ErisLogin"
readme = "README.md"
keywords = ["iroh", "pairing", "qr", "capability", "auth"]
categories = ["authentication", "network-programming"]

[features]
default = ["iroh", "qr", "prompt", "agent"]
# Iroh keys (`key`) and dialable ticket addresses (`Ticket::endpoint_addr`).
iroh = ["dep:iroh"]
# Tickets as QR codes (`qr`).
qr = ["dep:qrcode", "dep:png"]
# Asking the device's ErisAuth instead of showing a ticket (`agent`, Unix).
agent = ["tokio/net", "tokio/io-util"]
# The host's terminal ceremony (`prompt`).
prompt = ["qr", "tokio/rt", "tokio/macros", "tokio/time", "tokio/signal"]

[dependencies]
base64 = "0.22"
hmac = "0.12"
iroh = { version = "1", optional = true }
png = { version = "0.18.1", optional = true }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"], optional = true }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rqrr = "0.10.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[[test]]
name = "key"
required-features = ["iroh"]

[[test]]
name = "qr"
required-features = ["qr"]

[[test]]
name = "prompt"
required-features = ["prompt"]

[[test]]
name = "agent"
required-features = ["agent"]
