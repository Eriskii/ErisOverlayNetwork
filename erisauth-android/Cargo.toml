[package]
name = "erisauth-android"
version = "0.2.0"
edition = "2024"
description = "ErisAuth's daemon as a JNI library for the Android app"
license = "MIT"

[lib]
name = "erisauth_android"
crate-type = ["cdylib"]

[dependencies]
erisauth = { path = ".." }
erisoverlaynetwork = { git = "https://github.com/Eriskii/ErisOverlayNetwork", tag = "v0.2.0" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
